  - cve: CVE-2019-20920
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/d54137810a49939fd2ad01a91a34e182ece4528e
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2019-20920
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/compare/b79b2e2~1...d9d08a9
    basis: backport
    artifacts:
      - handlebars
    note: "New in this release; upstream's fix in 4.5.2. The lookup helper coerces the field with String() before its dangerous-property check, so a field such as [\"constructor\"] no longer reaches the constructor; CVE-2019-19919's port of upstream's 3.x backport 156061e in this release already carries that coercion, as upstream's 4.x fix d541378 adds it, and this release adds upstream's GH-1603 regression test."
  - cve: GHSA-2cf5-4w76-r9qv
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/156061eb7707575293613d7fdf90e2bdaac029ee
    advisory_url: https://github.com/advisories/GHSA-2cf5-4w76-r9qv
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/compare/b79b2e2~1...d9d08a9
    basis: adapted
    artifacts:
      - handlebars
    note: "New in this release; upstream's fix in 3.0.8, adapted to 4.0.14. The same String() coercion of the lookup field as CVE-2019-20920 in this release (GHSA-2cf5-4w76-r9qv names the same fix)."
