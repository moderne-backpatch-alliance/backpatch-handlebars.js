  report: handlebars-4.0.15-backpatch-00005-tests.zip
  report_sha256: 18421802c3efdad82626686bbda60cb576517f697c118d45a24c357cced1fdec
  result: pass
  note: "upstream's spec/ mocha suite in all seven entry envs (runtime, browser, node, their min builds, cjs and runtime cjs) on the packed package, plus the bin check at the tested commit: 4282 tests, 4100 passed, 0 failed, 182 skipped. The CVE tests (spec/expected/empty.amd.js spec/precompiler.js), with this release's production lines reverted at the tested commit: 42 tests, 0 passed, 42 failed, 0 skipped; with them: 42 tests, 42 passed, 0 failed, 0 skipped. Built with grunt (clean build amd uglify copy:dist) in a directory named handlebars, 82 of npmjs's 106 files for 4.0.14 are identical; the rest are dist/amd/handlebars/compiler/base.js, dist/amd/handlebars/compiler/javascript-compiler.js, dist/amd/handlebars/helpers/lookup.js, dist/amd/handlebars/utils.js, dist/amd/precompiler.js, dist/cjs/handlebars/compiler/base.js, dist/cjs/handlebars/compiler/javascript-compiler.js, dist/cjs/handlebars/helpers/lookup.js, dist/cjs/handlebars/utils.js, dist/cjs/precompiler.js, dist/handlebars.amd.js, dist/handlebars.amd.min.js, dist/handlebars.js, dist/handlebars.min.js, dist/handlebars.runtime.amd.js, dist/handlebars.runtime.amd.min.js, dist/handlebars.runtime.js, dist/handlebars.runtime.min.js, lib/handlebars/compiler/base.js, lib/handlebars/compiler/javascript-compiler.js, lib/handlebars/helpers/lookup.js, lib/handlebars/utils.js, lib/precompiler.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. Untested vector for CVE-2026-33941: the tests call the precompiler's cli() in process with crafted template names and options; bin/handlebars run on template files whose names or command-line options carry the payload is not run as a test (bin/handlebars passes them to the same cli())."
