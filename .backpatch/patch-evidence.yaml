  report_sha256: 188eec5b22d7f0db689439fb6c94cd39031021cd4b26479a0fad5eb1d9a1d3f7
  result: pass
  note: "upstream's spec/ mocha suite in all seven entry envs (runtime, browser, node, their min builds, cjs and runtime cjs) on the packed package, plus the bin check at the tested commit: 4236 tests, 4054 passed, 0 failed, 182 skipped. The CVE tests (spec/compiler.js spec/security.js), with this release's production lines reverted at the tested commit: 49 tests, 25 passed, 24 failed, 0 skipped; with them: 49 tests, 49 passed, 0 failed, 0 skipped. Built with grunt (clean build amd uglify copy:dist) in a directory named handlebars, 85 of npmjs's 106 files for 4.0.14 are identical; the rest are dist/amd/handlebars/compiler/base.js, dist/amd/handlebars/compiler/javascript-compiler.js, dist/amd/handlebars/helpers/lookup.js, dist/amd/handlebars/utils.js, dist/cjs/handlebars/compiler/base.js, dist/cjs/handlebars/compiler/javascript-compiler.js, dist/cjs/handlebars/helpers/lookup.js, dist/cjs/handlebars/utils.js, dist/handlebars.amd.js, dist/handlebars.amd.min.js, dist/handlebars.js, dist/handlebars.min.js, dist/handlebars.runtime.amd.js, dist/handlebars.runtime.amd.min.js, dist/handlebars.runtime.js, dist/handlebars.runtime.min.js, lib/handlebars/compiler/base.js, lib/handlebars/compiler/javascript-compiler.js, lib/handlebars/helpers/lookup.js, lib/handlebars/utils.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. Untested vector for CVE-2026-33938: the tests pass crafted ASTs to compile and precompile and through a dynamic partial lookup; the advisory's own path, an AST planted in @partial-block and compiled by invokePartial, is not run as a test (the validation sits in parse, which that path also goes through)."
