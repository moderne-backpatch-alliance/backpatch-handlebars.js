  - cve: CVE-2019-20920
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/d54137810a49939fd2ad01a91a34e182ece4528e
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2019-20920
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/compare/b79b2e2~1...d9d08a9
    basis: backport
    artifacts:
      - handlebars
    note: "Carried from 4.0.15-backpatch-00001; upstream's fix in 4.5.2. The lookup helper coerces the field with String() before its dangerous-property check, so a field such as [\"constructor\"] no longer reaches the constructor; CVE-2019-19919's port of upstream's 3.x backport 156061e in this release already carries that coercion, as upstream's 4.x fix d541378 adds it, and this release adds upstream's GH-1603 regression test."
  - cve: GHSA-2cf5-4w76-r9qv
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/156061eb7707575293613d7fdf90e2bdaac029ee
    advisory_url: https://github.com/advisories/GHSA-2cf5-4w76-r9qv
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/compare/b79b2e2~1...d9d08a9
    basis: adapted
    artifacts:
      - handlebars
    note: "Carried from 4.0.15-backpatch-00001; upstream's fix in 3.0.8, adapted to 4.0.14. The same String() coercion of the lookup field as CVE-2019-20920 in this release (GHSA-2cf5-4w76-r9qv names the same fix)."
  - cve: CVE-2021-23383
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/f0589701698268578199be25285b2ebea1c1e427
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2021-23383
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/commit/0331460
    basis: backport
    artifacts:
      - handlebars
    note: "Carried from 4.0.15-backpatch-00002; upstream's fix in 4.7.7. It closes the advisory: Prototype Pollution in handlebars."
  - cve: CVE-2026-33937
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/68d8df5a88e0a26fe9e6084c5c6aaebe67b07da2
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-33937
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/commit/0d378ec
    basis: adapted
    artifacts:
      - handlebars
    note: "New in this release; upstream's fix in 4.7.9, adapted to 4.0.14. A pre-parsed AST passed to compile or precompile is validated before code generation (PathExpression depth, parts, NumberLiteral and BooleanLiteral values), the lib/handlebars/compiler/base.js part of upstream's fix, which closes CVE-2026-33937, CVE-2026-33938 and CVE-2026-33940 with the same hunk."
  - cve: CVE-2026-33938
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/68d8df5a88e0a26fe9e6084c5c6aaebe67b07da2
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-33938
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/commit/0d378ec
    basis: adapted
    artifacts:
      - handlebars
    note: "New in this release; upstream's fix in 4.7.9, adapted to 4.0.14. The same base.js AST validation as CVE-2026-33937 in this release closes the @partial-block AST type confusion, to the extent upstream's 4.7.9 does."
  - cve: CVE-2026-33940
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/68d8df5a88e0a26fe9e6084c5c6aaebe67b07da2
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-33940
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/commit/0d378ec
    basis: adapted
    artifacts:
      - handlebars
    note: "New in this release; upstream's fix in 4.7.9, adapted to 4.0.14. The same base.js AST validation as CVE-2026-33937 in this release rejects pre-parsed AST node values that would be written into generated code."
tests:
