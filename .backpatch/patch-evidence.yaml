  command: grunt clean build amd uglify copy:dist, npm pack; spec/ at the commit with mocha 5.2.0, one process per env (runtime, browser, node, runtime-min, browser-min, verify-cjs, verify-runtime-cjs) on the packed package next to npmjs 4.0.14's dependencies; bin/handlebars -a spec/artifacts/empty.handlebars compared with spec/expected/empty.amd.js
