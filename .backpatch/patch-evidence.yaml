  - cve: CVE-2026-33941
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/68d8df5a88e0a26fe9e6084c5c6aaebe67b07da2
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-33941
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/compare/ced31ac~1...4abc503
    basis: adapted
    artifacts:
      - handlebars
    note: "Carried from 4.0.15-backpatch-00005; upstream's fix in 4.7.9 (68d8df5, f37c599), adapted to 4.0.14. The precompiler quotes template names and the --commonjs and --handlebarPath values, rejects a --namespace that is not a dotted identifier, and sanitizes the --map source map comment, also on --min (upstream's 68d8df5 precompiler.js part and its repair f37c599)."
  - cve: CVE-2026-106444
    upstream_fix_url: https://github.com/handlebars-lang/handlebars.js/commit/609d1b11c833c9a3e00f56f2f34d22f425446725
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-106444
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-handlebars.js/commit/9957799
    basis: adapted
    artifacts:
      - handlebars
    note: "Carried from 4.0.15-backpatch-00006; upstream's fix in 4.7.10, adapted to 4.0.14. Generated code escapes the < of <!--, <script and </script, and control characters and surrogates, in lookup names, partial indents and tracked block param ids, and the precompiler quotes template names and module paths the same way, so precompiled output is safe inside a script element."
  - cve: CVE-2026-106446
